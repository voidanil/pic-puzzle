<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pic puzzle</title>
    <link
      rel="shortcut icon"
      href="https://www.svgrepo.com/show/398147/puzzle-piece.svg"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container-center">
      <div class="container">
        <div>
          <label for="photoInput" class="input-btn"
            ><img src="https://www.svgrepo.com/show/530396/upload.svg"
          /></label>
        </div>
        <input type="file" name="photoInput" id="photoInput" accept="image/*" />
        <div class="preview-section">
          <div class="photo-preview">Preview Section</div>
          <div class="puzzle">
            <div class="slice slice1" id="slice11">
              <img id="slice1" />
            </div>
            <div class="slice slice2" id="slice12">
              <img id="slice2" />
            </div>
            <div class="slice slice3" id="slice13">
              <img id="slice3" />
            </div>
            <div class="slice slice4" id="slice14">
              <img id="slice4" />
            </div>
            <div class="slice slice5" id="slice15">
              <img id="slice5" />
            </div>
            <div class="slice slice6" id="slice16">
              <img id="slice6" />
            </div>
            <div class="slice slice7" id="slice17">
              <img id="slice7" />
            </div>
            <div class="slice slice8" id="slice18">
              <img id="slice8" />
            </div>
            <div class="slice slice9" id="slice19">
              <img id="slice9" />
            </div>
          </div>
        </div>
        <div class="info-section">
          <p class="info"></p>
          <button class="suffle-btn">Suffle</button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  </body>
</html>
