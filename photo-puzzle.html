<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Puzzle</title>
    <link
      rel="shortcut icon"
      href="https://www.svgrepo.com/show/398147/puzzle-piece.svg"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container-center">
      <div class="container">
        <div>
          <label for="photoInput" class="input-btn"
            ><img src="https://www.svgrepo.com/show/530396/upload.svg"
          /></label>
        </div>
        <input type="file" name="photoInput" id="photoInput" accept="image/*" />
        <div class="preview-section">
          <div class="photo-preview"></div>
          <div class="puzzle">
            <div class="slice slice1"><img id="slice1" />Slice 1</div>
            <div class="slice slice2"><img id="slice2" />Slice2</div>
            <div class="slice slice3"><img id="slice3" />Slice3</div>
            <div class="slice slice4"><img id="slice4" />Slice4</div>
            <div class="slice slice5"><img id="slice5" />Slice5</div>
            <div class="slice slice6"><img id="slice6" />Slice6</div>
            <div class="slice slice7"><img id="slice7" />Slice7</div>
            <div class="slice slice8"><img id="slice8" />Slice8</div>
            <div class="slice slice9"><img id="slice9" />Slice9</div>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
